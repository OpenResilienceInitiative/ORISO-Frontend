name: Account operation intent contract

on:
    pull_request:
    push:
        branches-ignore:
            - main
            - dev
            - pre-dev

permissions:
    contents: read

concurrency:
    group: account-intents-${{ github.ref }}
    cancel-in-progress: true

jobs:
    contract:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '22.12.0'
            - name: Check actual client action and request contracts without dependencies
              run: npm run test:account-intents
