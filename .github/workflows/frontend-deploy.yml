name: 'ORISO Frontend Deploy'

run-name: Deploy ${{ github.event.inputs.component || 'frontend' }} to ${{ github.event.inputs.environment }}

# Rolls the frontend out on one of the ORISO servers by running that
# server's own deploy script over SSH.
#
# Why it runs here and not in an agent's cloud session: cloud sessions only
# get HTTPS out through a proxy, so they cannot reach port 22 on the servers.
# They can start this workflow and read its log, which keeps the SSH key in
# GitHub's secret store instead of in a container or a chat.
#
# dev and pre-dev each have their own GitHub environment holding the same
# secret names, so one job serves both:
#
#   GitHub environment   server               secrets (environment-scoped)
#   development          dev.oriso.org        DEPLOY_SSH_HOST, DEPLOY_SSH_KEY
#   pre-development      predev.oriso.org     DEPLOY_SSH_HOST, DEPLOY_SSH_KEY
#
# Optional in both: DEPLOY_SSH_USER (default root), DEPLOY_SSH_PORT (default
# 22) and DEPLOY_SSH_FINGERPRINT (the server's SHA256 host key fingerprint;
# when set, the runner refuses to talk to any other host). Use the server's
# ECDSA host key fingerprint (/etc/ssh/ssh_host_ecdsa_key.pub), not the
# ED25519 one: with appleboy/ssh-action only the ECDSA fingerprint matched; the
# ED25519 one fails with "host key fingerprint mismatch".
#
# Each server has its own script folder, because the scripts differ in which
# image tag they roll out:
#   dev      /root/deploy-script         deploys the :dev image
#   pre-dev  /root/predev-deploy-script  deploys the :pre-dev image

on:
    workflow_dispatch:
        inputs:
            environment:
                type: choice
                description: Target environment
                required: true
                default: pre-dev
                options:
                    - pre-dev
                    - dev
                    - prod
            component:
                type: choice
                description: What to roll out (storybook = restart both Dev Storybooks so they pull the current :dev image)
                required: true
                default: frontend
                options:
                    - frontend
                    - storybook
                    - predev-status
                    - predev-helm-check

permissions:
    contents: read

# Two rollouts on the same server at once would race on the same
# deployment. A running rollout is never cancelled; a newer request
# replaces one that is still pending, which is fine because the server
# script always deploys whatever is current.
concurrency:
    group: frontend-deploy-${{ github.event.inputs.environment }}-${{ github.event.inputs.component || 'frontend' }}
    cancel-in-progress: false

jobs:
    deploy-oriso-server:
        name: Deploy to ${{ github.event.inputs.environment }}
        if: ${{ (github.event.inputs.component || 'frontend') == 'frontend' && (github.event.inputs.environment == 'dev' || github.event.inputs.environment == 'pre-dev') }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment:
            name: ${{ github.event.inputs.environment == 'dev' && 'development' || 'pre-development' }}
            url: ${{ github.event.inputs.environment == 'dev' && 'https://dev.oriso.org' || 'https://predev.oriso.org' }}
        steps:
            # Without this step a missing secret shows up as an opaque SSH error.
            - name: Check the deploy secrets are set
              env:
                  TARGET: ${{ github.event.inputs.environment == 'dev' && 'development' || 'pre-development' }}
                  HAS_HOST: ${{ secrets.DEPLOY_SSH_HOST != '' }}
                  HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
                  HAS_FINGERPRINT: ${{ secrets.DEPLOY_SSH_FINGERPRINT != '' }}
              run: |
                  missing=""
                  [ "$HAS_HOST" = "true" ] || missing="$missing DEPLOY_SSH_HOST"
                  [ "$HAS_KEY" = "true" ] || missing="$missing DEPLOY_SSH_KEY"
                  if [ -n "$missing" ]; then
                    echo "::error::GitHub environment '$TARGET' is missing:$missing (Settings → Environments → $TARGET)"
                    exit 1
                  fi
                  [ "$HAS_FINGERPRINT" = "true" ] || echo "::warning::DEPLOY_SSH_FINGERPRINT is not set in '$TARGET'; the server's host key is not verified."

            - name: Run deploy-frontend-dev.sh on the server
              uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
              with:
                  host: ${{ secrets.DEPLOY_SSH_HOST }}
                  username: ${{ secrets.DEPLOY_SSH_USER || 'root' }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
                  fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
                  # The action's default is 10m; a frontend rollout can take longer.
                  command_timeout: 25m
                  # The frontend script is called deploy-frontend-dev.sh in both
                  # folders, but the one in /root/deploy-script rolls out :dev
                  # even on the Pre-Dev server. Pre-Dev has its own folder
                  # whose script rolls out :pre-dev.
                  script: |
                      set -euo pipefail
                      cd ${{ github.event.inputs.environment == 'pre-dev' && '/root/predev-deploy-script' || '/root/deploy-script' }}
                      pwd
                      bash ./deploy-frontend-dev.sh

                      # Proof of what is running now, so the run log answers
                      # "which image is live?" without anyone logging in.
                      echo "--- frontend pods in namespace caritas after the deploy"
                      kubectl get pods -n caritas -l app=frontend \
                        -o jsonpath='{range .items[*]}{.metadata.name}{"  "}{.status.containerStatuses[0].image}{"  "}{.status.containerStatuses[0].imageID}{"\n"}{end}' \
                        || echo "(could not read the frontend pods; the deploy script result above still stands)"

    # Pre-Dev is the experimental lane (ORISO-Helm#679, ORISO-Frontend#2579): the agent working
    # on it reads the server's state here instead of logging in. Read only; prints no values
    # files, secrets or environment, only names, versions and images.
    predev-status:
        name: Pre-Dev status
        if: ${{ github.event.inputs.component == 'predev-status' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: pre-development
            url: https://predev.oriso.org
        steps:
            - name: Refuse anything but Pre-Dev
              env:
                  TARGET: ${{ github.event.inputs.environment }}
              run: |
                  [ "$TARGET" = "pre-dev" ] || { echo "::error::predev-status only runs against pre-dev"; exit 1; }
            - name: Read the server state
              uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
              with:
                  host: ${{ secrets.DEPLOY_SSH_HOST }}
                  username: ${{ secrets.DEPLOY_SSH_USER || 'root' }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
                  fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
                  command_timeout: 5m
                  script: |
                      set -u
                      echo "== tools"; for t in helm kubectl docker git node openssl; do printf '%s: ' $t; command -v $t || echo missing; done
                      echo "== disk"; df -h / | tail -1
                      echo "== script folders (names only)"; ls -1 /root/predev-deploy-script /root/deploy-script 2>&1
                      echo "== helm releases"; helm list -A 2>&1
                      echo "== namespaces"; kubectl get ns --no-headers -o custom-columns=NAME:.metadata.name 2>&1
                      echo "== workloads in caritas (image, ready)"
                      kubectl get deploy,statefulset -n caritas --no-headers -o custom-columns='NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,PULL:.spec.template.spec.containers[0].imagePullPolicy,READY:.status.readyReplicas' 2>&1
                      echo "== chart checkouts on the server"
                      for c in $(find /root /opt /srv /home -maxdepth 4 -name Chart.yaml -path '*elm*' 2>/dev/null | head -5); do
                        d=$(dirname "$c"); echo "-- $d"; (cd "$d" && git rev-parse --abbrev-ref HEAD 2>/dev/null; git log -1 --format='%h %cd %s' --date=short 2>/dev/null; git status --porcelain 2>/dev/null | head -5; ls -1 *.yaml 2>/dev/null)
                      done
                      echo "== addon namespace"; kubectl get all -n addons 2>&1 | head -20

    # Read only: server-side dry run of the pre-dev chart with Pre-Dev's own values
    # (ORISO-Helm predev-lane/helm-check.sh). Prints Helm's errors or the images it would
    # roll out; never values, secrets or manifests. Changes nothing.
    predev-helm-check:
        name: Pre-Dev Helm dry run
        if: ${{ github.event.inputs.component == 'predev-helm-check' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: pre-development
            url: https://predev.oriso.org
        steps:
            - name: Refuse anything but Pre-Dev
              env:
                  TARGET: ${{ github.event.inputs.environment }}
              run: |
                  [ "$TARGET" = "pre-dev" ] || { echo "::error::predev-helm-check only runs against pre-dev"; exit 1; }
            - name: Dry run on the server
              uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
              with:
                  host: ${{ secrets.DEPLOY_SSH_HOST }}
                  username: ${{ secrets.DEPLOY_SSH_USER || 'root' }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
                  fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
                  command_timeout: 10m
                  script: |
                      set -euo pipefail
                      D=/root/predev-lane/runner
                      mkdir -p /root/predev-lane && chmod 700 /root/predev-lane
                      [ -d "$D/.git" ] || git clone -q --depth 1 --branch pre-dev https://github.com/OpenResilienceInitiative/ORISO-Helm "$D"
                      git -C "$D" fetch -q --depth 1 origin pre-dev && git -C "$D" checkout -q -B pre-dev FETCH_HEAD
                      bash "$D/predev-lane/helm-check.sh"

    # Dev only: the chart-managed Storybooks (ORISO-Helm templates/storybook,
    # runbooks/dev-storybook.md) run oriso-storybook images with pullPolicy Always,
    # so a rollout restart pulls the image the Storybook workflows just published.
    # Pre-Dev's Storybooks are deployed outside the chart (predev-sync) and are not
    # touched here.
    restart-dev-storybook:
        name: Restart Storybook on ${{ github.event.inputs.environment }}
        if: ${{ github.event.inputs.component == 'storybook' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: development
            url: https://dev.oriso.org/storybook-frontend/
        steps:
            - name: Refuse anything but Dev
              env:
                  TARGET: ${{ github.event.inputs.environment }}
              run: |
                  if [ "$TARGET" != "dev" ]; then
                    echo "::error::component=storybook is only supported for environment=dev (Pre-Dev Storybooks are deployed by predev-sync, Prod has none)."
                    exit 1
                  fi

            - name: Check the deploy secrets are set
              env:
                  HAS_HOST: ${{ secrets.DEPLOY_SSH_HOST != '' }}
                  HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
                  HAS_FINGERPRINT: ${{ secrets.DEPLOY_SSH_FINGERPRINT != '' }}
              run: |
                  missing=""
                  [ "$HAS_HOST" = "true" ] || missing="$missing DEPLOY_SSH_HOST"
                  [ "$HAS_KEY" = "true" ] || missing="$missing DEPLOY_SSH_KEY"
                  if [ -n "$missing" ]; then
                    echo "::error::GitHub environment 'development' is missing:$missing (Settings → Environments → development)"
                    exit 1
                  fi
                  [ "$HAS_FINGERPRINT" = "true" ] || echo "::warning::DEPLOY_SSH_FINGERPRINT is not set in 'development'; the server's host key is not verified."

            - name: Restart storybook-frontend and storybook-admin
              uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
              with:
                  host: ${{ secrets.DEPLOY_SSH_HOST }}
                  username: ${{ secrets.DEPLOY_SSH_USER || 'root' }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
                  fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
                  command_timeout: 10m
                  script: |
                      set -euo pipefail
                      ns=caritas
                      echo "--- before"
                      kubectl get pods -n "$ns" -l 'app in (storybook-frontend,storybook-admin)' \
                        -o jsonpath='{range .items[*]}{.metadata.labels.app}{"  "}{.status.containerStatuses[0].imageID}{"\n"}{end}'
                      for d in storybook-frontend storybook-admin; do
                        kubectl rollout restart "deployment/$d" -n "$ns"
                      done
                      for d in storybook-frontend storybook-admin; do
                        kubectl rollout status "deployment/$d" -n "$ns" --timeout=5m
                      done
                      # Proof of what is running now, so the run log answers
                      # "which image is live?" without anyone logging in.
                      echo "--- after"
                      kubectl get pods -n "$ns" -l 'app in (storybook-frontend,storybook-admin)' \
                        -o jsonpath='{range .items[*]}{.metadata.labels.app}{"  "}{.status.containerStatuses[0].image}{"  "}{.status.containerStatuses[0].imageID}{"\n"}{end}'

    deploy-prod:
        if: ${{ github.event.inputs.environment == 'prod' && (github.event.inputs.component || 'frontend') == 'frontend' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: production
        steps:
            - name: Deploy to production server
              uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
              with:
                  host: ${{ secrets.PROD_SSH_HOST }}
                  username: ${{ secrets.PROD_SSH_USER }}
                  key: ${{ secrets.PROD_SSH_KEY }}
                  port: ${{ secrets.PROD_SSH_PORT || 22 }}
                  script: |
                      set -euo pipefail
                      bash /home/caritas/Desktop/online-beratung/caritas-workspace/ORISO-Frontend/deploy-production.sh
