name: Close Linked Issues

# GitHub only honours "Closes #n" for pull requests into the DEFAULT branch
# (main). All work merges into pre-dev, so the keyword silently does nothing
# and fixed issues stay open (#1015). This workflow restores the behaviour:
# when a pull request is merged into pre-dev, every same-repo issue named by
# a closing keyword in the pull request body is closed with a back-reference.
#
# pull_request_target: runs the workflow definition from the base branch, so
# pull requests created before this file existed still trigger it. The PR
# body is only fed to a regex and the REST API - no checkout, no shell
# interpolation - so the untrusted-input concerns of pull_request_target do
# not apply.

on:
  pull_request_target:
    types: [closed]
    branches: [pre-dev]

permissions:
  issues: write

jobs:
  close-linked-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced by closing keywords
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            // GitHub's closing keywords, same-repo references only.
            const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            const numbers = [...new Set([...body.matchAll(keyword)].map((m) => Number(m[1])))];
            if (numbers.length === 0) {
              core.info('no closing keywords in the pull request body');
              return;
            }
            for (const issue_number of numbers) {
              try {
                const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
                if (issue.pull_request) {
                  core.info(`#${issue_number} is a pull request, skipping`);
                  continue;
                }
                if (issue.state === 'closed') {
                  core.info(`#${issue_number} is already closed`);
                  continue;
                }
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number,
                  body: `Closed by #${pr.number}, merged into \`pre-dev\`.`,
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number,
                  state: 'closed',
                  state_reason: 'completed',
                });
                core.info(`closed #${issue_number}`);
              } catch (error) {
                core.warning(`#${issue_number}: ${error.message}`);
              }
            }
