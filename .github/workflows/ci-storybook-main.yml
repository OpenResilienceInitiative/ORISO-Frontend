name: Storybook Build and Publish

on:
  push:
    branches:
      - main
      - dev
      - pre-dev

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  publish:
    name: build and publish Storybook image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # No node-build step: "Frontend Build and Publish" runs lint, type-check
      # and unit tests on the same commit, and Dockerfile.storybook runs its own
      # install and `npm run build-storybook`.
      - name: Publish Storybook Docker image
        uses: ./.github/actions/docker-build-push
        with:
          push_to_ghcr: true
          image_name: oriso-storybook
          dockerfile: Dockerfile.storybook
          github_token: ${{ secrets.GITHUB_TOKEN }}
