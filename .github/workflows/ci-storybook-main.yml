name: Storybook Build and Publish

on:
    push:
        branches:
            - main
            - dev
            - pre-dev

env:
    REGISTRY: ghcr.io
    ORG: openresilienceinitiative

# A publishing run must finish: cancelling one halfway is worse
# than paying for it.
concurrency:
    group: frontend-storybook-main-${{ github.ref }}
    cancel-in-progress: false

jobs:
    # The real call views from ORISO-ElementCall for the "Call / Views" story
    # (#2233). Its own job on purpose: building them runs another
    # repository's install scripts, which must never share a job with the
    # registry token. A failure here must not stop the publish; the story
    # then says the pages are missing.
    call-harness:
        name: build the Element Call view pages
        runs-on: ubuntu-latest
        timeout-minutes: 20
        continue-on-error: true
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: ./.github/actions/call-harness
              with:
                  ref: ${{ github.ref_name }}

    publish:
        name: lint, type-check, build and publish Storybook image
        runs-on: ubuntu-latest
        timeout-minutes: 60
        needs: call-harness
        # Publish whatever happened to the call view pages.
        if: ${{ !cancelled() }}

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            # Kept on the publish path even though "Frontend Build and Publish" runs
            # the same checks on the same commit. The two workflows are independent,
            # so a red frontend run cannot stop this one, and nothing here would
            # otherwise prevent publishing a Storybook image built from code that
            # fails lint or unit tests. On the PR path the equivalent step is dropped:
            # there "Frontend PR Validation" reports as its own visible check on the
            # same commit, so the reviewer sees the failure before anything merges.
            - name: Run frontend validation and build
              uses: ./.github/actions/node-build
              with:
                  node_version: '22.23.3'

            # The image copies this output instead of rebuilding Storybook inside
            # Docker; see the header of Dockerfile.storybook.
            - name: Build Storybook static output
              run: npm run build-storybook

            - name: Add the Element Call view pages
              continue-on-error: true
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: call-harness
                  path: storybook-static/call-harness

            - name: Publish Storybook Docker image
              uses: ./.github/actions/docker-build-push
              with:
                  push_to_ghcr: true
                  image_name: oriso-storybook
                  dockerfile: Dockerfile.storybook
                  github_token: ${{ secrets.GITHUB_TOKEN }}
