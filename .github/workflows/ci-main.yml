name: Frontend Build and Publish

on:
    push:
        branches:
            - main
            - dev
            - pre-dev

env:
    REGISTRY: ghcr.io
    ORG: openresilienceinitiative

# A publishing run must finish: cancelling one halfway is worse
# than paying for it.
concurrency:
    group: frontend-main-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: lint, type-check, build and publish image
        runs-on: ubuntu-latest
        # Multi-arch build + Trivy + attestation; success median is ~29 min.
        # No cancel-in-progress here — this produces the deployed image.
        timeout-minutes: 60

        permissions:
            contents: read
            id-token: write
            attestations: write
            artifact-metadata: write
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Run frontend validation and build
              uses: ./.github/actions/node-build
              with:
                  node_version: '22.23.3'

            - name: Build, scan and publish frontend Docker image
              id: image
              uses: ./.github/actions/docker-build-push
              with:
                  push_to_ghcr: true
                  image_name: oriso-frontend
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Sign and publish the image provenance attestation
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
              with:
                  subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/oriso-frontend
                  subject-digest: ${{ steps.image.outputs.digest }}
                  push-to-registry: true

            - name: Record immutable release digest
              run: echo '${{ env.REGISTRY }}/${{ env.ORG }}/oriso-frontend@${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
