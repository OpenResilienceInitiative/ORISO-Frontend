name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to trigger CodeRabbit for; requires CODERABBIT_TRIGGER_TOKEN"
        required: false
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  coderabbit:
    name: CodeRabbit trigger
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CodeRabbit reviews
        env:
          GH_TOKEN: ${{ secrets.CODERABBIT_TRIGGER_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::CODERABBIT_TRIGGER_TOKEN is not configured; skipping manual CodeRabbit trigger."
            echo "::notice::CodeRabbit auto-review still runs from .coderabbit.yaml, and the local Codex automation can trigger CodeRabbit as the authenticated GitHub user."
            exit 0
          fi

          trigger_one() {
            local pr_number="$1"
            local head_sha="$2"
            local marker="<!-- ai-pr-review:coderabbit:${head_sha} -->"

            if gh api "repos/${GH_REPO}/issues/${pr_number}/comments?per_page=100" \
              --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | grep -q .; then
              echo "CodeRabbit already triggered for PR #${pr_number} at ${head_sha}."
              return 0
            fi

            {
              echo "${marker}"
              echo "@coderabbitai review"
            } > /tmp/coderabbit-trigger.md

            gh pr comment "${pr_number}" --repo "${GH_REPO}" --body-file /tmp/coderabbit-trigger.md
            echo "Triggered CodeRabbit for PR #${pr_number} at ${head_sha}."
          }

          if [ -n "${EVENT_PR_NUMBER:-}" ]; then
            trigger_one "${EVENT_PR_NUMBER}" "${EVENT_HEAD_SHA}"
            exit 0
          fi

          if [ -n "${INPUT_PR_NUMBER:-}" ]; then
            head_sha="$(gh pr view "${INPUT_PR_NUMBER}" --repo "${GH_REPO}" --json headRefOid --jq .headRefOid)"
            trigger_one "${INPUT_PR_NUMBER}" "${head_sha}"
            exit 0
          fi

          for base in dev main; do
            gh pr list --repo "${GH_REPO}" --base "${base}" --state open --limit 100 \
              --json number,headRefOid --jq '.[] | [.number, .headRefOid] | @tsv' |
            while IFS=$'\t' read -r pr_number head_sha; do
              [ -n "${pr_number}" ] || continue
              trigger_one "${pr_number}" "${head_sha}"
            done
          done

  cursor:
    name: Cursor thermonuclear review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check Cursor prerequisites
        id: guard
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          LAST_COMMIT_MESSAGE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [ -z "${CURSOR_API_KEY:-}" ]; then
            echo "::notice::CURSOR_API_KEY is not configured; skipping Cursor review."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "::notice::Skipping Cursor write-capable review for fork PR ${HEAD_REPO}."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Refresh the knowledge graph from the published channel
        if: steps.guard.outputs.run == 'true'
        id: ua_graph
        # The graph committed in this repository is refreshed by hand and has
        # been months behind before. The review prompt below calls it mandatory
        # context, so a stale copy makes the reviewer reason confidently about
        # code that no longer exists — silently, because nothing says how old it
        # is. ORISO-Docs rebuilds the graph daily and publishes it here; this
        # step overwrites only the generated files with the current generation.
        #
        # Deliberately fail-soft (no `set -e`): a missing asset, a CDN hiccup or
        # a replacement window mid-publish must degrade to the committed copy,
        # never fail a review. The outcome is reported either way so a reviewer
        # comment can always be traced to a known graph revision.
        env:
          UA_CHANNEL: https://github.com/OpenResilienceInitiative/ORISO-Docs/releases/download/ua-graph-latest
        run: |
          set -uo pipefail
          repo="${GITHUB_REPOSITORY##*/}"
          work="$(mktemp -d)"
          state="committed copy (no refresh)"

          if curl -fsSL --retry 3 --retry-delay 2 --max-time 180 \
               "${UA_CHANNEL}/${repo}.tar.gz" -o "${work}/graph.tar.gz" \
             && tar -xzf "${work}/graph.tar.gz" -C "${work}"; then
            fresh="${work}/${repo}/.understand-anything"
            if [ -d "${fresh}" ]; then
              mkdir -p .understand-anything
              # Copy, do not replace the directory: ARCHITECTURE.md, ONBOARDING.md
              # and the other prose in here are hand-written and are not part of
              # the generation.
              cp -f "${fresh}"/* .understand-anything/
              state="$(python3 -c 'import json;m=json.load(open(".understand-anything/meta.json"));print(m["gitCommitHash"][:12], m["lastAnalyzedAt"])' 2>/dev/null || echo "refreshed")"
              behind="$(git rev-list --count "${state%% *}..HEAD" 2>/dev/null || echo "?")"
              state="built from ${state} (${behind} commits behind this branch)"
            else
              echo "::warning::Published asset for ${repo} has an unexpected layout."
            fi
          else
            echo "::warning::Could not fetch the current graph for ${repo}; using the committed copy, which may be far behind."
          fi

          rm -rf "${work}"
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "Knowledge graph: ${state}" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure git author
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "oriso-ai-review[bot]"
          git config user.email "oriso-ai-review[bot]@users.noreply.github.com"

      - name: Install Cursor CLI
        if: steps.guard.outputs.run == 'true'
        env:
          # Pin the Cursor Agent CLI to an immutable versioned build instead of
          # piping the mutable `curl https://cursor.com/install | bash` installer
          # into a shell. That installer runs whatever code the vendor serves at
          # request time inside a job that holds a write-capable token, which is a
          # prompt-injection / supply-chain surface. Cursor does not publish a
          # checksum for the tarball, so the pinned immutable version URL is the
          # integrity anchor. Bump CURSOR_CLI_VERSION deliberately to upgrade.
          CURSOR_CLI_VERSION: "2026.07.01-41b2de7"
        run: |
          set -euo pipefail
          arch="$(uname -m)"; case "$arch" in x86_64|amd64) arch=x64;; arm64|aarch64) arch=arm64;; esac
          install_dir="$HOME/.local/share/cursor-agent/versions/${CURSOR_CLI_VERSION}"
          mkdir -p "$install_dir" "$HOME/.local/bin"
          curl -fSL "https://downloads.cursor.com/lab/${CURSOR_CLI_VERSION}/linux/${arch}/agent-cli-package.tar.gz" \
            | tar --strip-components=1 -xzf - -C "$install_dir"
          ln -sf "$install_dir/cursor-agent" "$HOME/.local/bin/cursor-agent"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/cursor-agent" --version

      - name: Run Cursor thermonuclear review
        if: steps.guard.outputs.run == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
          # Interpolated into the prompt so the reviewer is told how current its
          # index is instead of assuming it matches the branch under review.
          UA_GRAPH_STATE: ${{ steps.ua_graph.outputs.state }}
        run: |
          set -euo pipefail

          git fetch origin "${BASE_REF}:${BASE_REF}" || true

          model_args=()
          if [ -n "${CURSOR_MODEL:-}" ]; then
            model_args=(--model "${CURSOR_MODEL}")
          fi

          prompt="$(cat <<PROMPT
          You are Cursor running ORISO's thermonuclear PR review.

          Goal: reduce human review work without creating churn.

          Mandatory context:
          - Read AGENTS.md first.
          - Use .understand-anything/README.md, .understand-anything/ARCHITECTURE.md,
            .understand-anything/ORISO-ECOSYSTEM.md, and .understand-anything/knowledge-graph.json
            when they help you understand the code quickly.
            That graph is ${UA_GRAPH_STATE}. It is an index, not the truth: read the
            actual file before reporting anything based on it, and never report a
            finding whose evidence is only in the graph. Any summary marked
            "[Dated orientation; ...]" is unverified prose — treat it as a hint.
          - Compare this PR against origin/${BASE_REF:-dev}.

          Review focus:
          - correctness, mergeability, broken tests/types/lint
          - missing validation evidence
          - privacy/security regressions
          - duplicated UI/state architecture that should be shared
          - accessible focus and keyboard behavior

          If you find a clearly safe, scoped improvement:
          1. Make the smallest change.
          2. Run the narrowest relevant test/build/lint command.
          3. Commit it with a concise message beginning "fix(ai-review):".
          4. Push to this PR branch.

          If the issue is ambiguous, broad, or not safely testable, do not edit.
          Leave a concise finding in your final summary instead.

          Do not reformat unrelated files. Do not change generated output unless
          the source change requires it.
          PROMPT
          )"

          "$HOME/.local/bin/cursor-agent" \
            --api-key "${CURSOR_API_KEY}" \
            --trust \
            --force \
            --output-format text \
            --print \
            --workspace "$GITHUB_WORKSPACE" \
            "${model_args[@]}" \
            "$prompt" | tee /tmp/cursor-review.md

      - name: Comment Cursor summary
        if: steps.guard.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          marker="<!-- ai-pr-review:cursor:${HEAD_SHA} -->"
          {
            echo "${marker}"
            echo "## Cursor Thermonuclear Review"
            echo
            echo '```text'
            tail -c 60000 /tmp/cursor-review.md
            echo
            echo '```'
          } > /tmp/cursor-comment.md

          gh pr comment "${PR_NUMBER}" --repo "${GH_REPO}" --body-file /tmp/cursor-comment.md
