name: Frontend Release Image

run-name: Publish frontend release image from ${{ github.ref_name }}

on:
  push:
    branches:
      - "release/frontend-*"

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative
  IMAGE_NAME: oriso-frontend
  STORYBOOK_IMAGE_NAME: oriso-storybook

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: validate, build, tag and publish release image
    if: ${{ github.event.deleted == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract and validate release version
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"
          VERSION="${BRANCH#release/frontend-}"

          if [[ "$BRANCH" == "$VERSION" ]]; then
            echo "Invalid release branch. Expected release/frontend-X.Y.Z"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format, for example 2.0.1"
            exit 1
          fi

          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "refs/tags/v${VERSION}"; then
            echo "Tag v${VERSION} already exists. Choose a new version or delete the incorrect tag first."
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${ORG}/${IMAGE_NAME}:${VERSION}" >> "$GITHUB_ENV"
          echo "STORYBOOK_IMAGE=${REGISTRY}/${ORG}/${STORYBOOK_IMAGE_NAME}:${VERSION}" >> "$GITHUB_ENV"

      - name: Run frontend validation and build
        uses: ./.github/actions/node-build
        with:
          node_version: '18'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned frontend Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish versioned Storybook Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.storybook
          push: true
          tags: ${{ env.STORYBOOK_IMAGE }}
          labels: |
            org.opencontainers.image.title=${{ env.STORYBOOK_IMAGE_NAME }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release frontend v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Frontend v${{ env.VERSION }}
          generate_release_notes: true
          body: |
            ## Release Artifact

            Docker images:
            `${{ env.IMAGE }}`
            `${{ env.STORYBOOK_IMAGE }}`

            Source commit:
            `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        shell: bash
        run: |
          {
            echo "### Frontend release image"
            echo ""
            echo "- Git tag: \`v${VERSION}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Storybook image: \`${STORYBOOK_IMAGE}\`"
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- GitHub Release: \`Frontend v${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
