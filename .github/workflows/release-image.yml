name: Frontend Release Image

run-name: Validate frontend release from ${{ github.ref_name }}

on:
    push:
        branches:
            - 'release/frontend-*'

concurrency:
    group: frontend-release-${{ github.ref }}
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    ORG: openresilienceinitiative
    IMAGE_NAME: oriso-frontend
    STORYBOOK_IMAGE_NAME: oriso-storybook

permissions:
    contents: write
    id-token: write
    attestations: write
    artifact-metadata: write
    packages: write

jobs:
    # The real call views from ORISO-ElementCall for the "Call / Views" story
    # (#2233). Its own job on purpose: building them runs another
    # repository's install scripts, which must never share a job with the
    # registry token. A failure here must not stop the publish; the story
    # then says the pages are missing.
    call-harness:
        name: build the Element Call view pages
        if: ${{ github.event.deleted == false }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        continue-on-error: true
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: ./.github/actions/call-harness
              with:
                  ref: main

    release:
        name: validate and publish or verify existing release
        # Publish whatever happened to the call view pages.
        if: ${{ !cancelled() && github.event.deleted == false }}
        needs: call-harness
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            - name: Checkout release branch
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Extract and validate release version
              shell: bash
              run: |
                  set -euo pipefail

                  BRANCH="${GITHUB_REF_NAME}"
                  VERSION="${BRANCH#release/frontend-}"

                  if [[ "$BRANCH" == "$VERSION" ]]; then
                    echo "Invalid release branch. Expected release/frontend-X.Y.Z"
                    exit 1
                  fi

                  if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Version must use MAJOR.MINOR.PATCH format, for example 2.0.1"
                    exit 1
                  fi

                  echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
                  echo "IMAGE=${REGISTRY}/${ORG}/${IMAGE_NAME}:${VERSION}" >> "$GITHUB_ENV"
                  echo "STORYBOOK_IMAGE=${REGISTRY}/${ORG}/${STORYBOOK_IMAGE_NAME}:${VERSION}" >> "$GITHUB_ENV"

            - name: Test release guard
              run: python3 -m unittest discover -s .github/scripts/release-publisher -p 'test_*.py'

            - name: Classify release and verify existing artifacts
              id: disposition
              env:
                  GH_TOKEN: ${{ github.token }}
              run: python3 .github/scripts/release-publisher/guard.py classify "$VERSION"

            - name: Run frontend validation and build
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              uses: ./.github/actions/node-build
              with:
                  node_version: '22.23.3'

            # The Storybook image copies this output instead of rebuilding Storybook
            # inside Docker (see the header of Dockerfile.storybook), so the release
            # has to produce it exactly as ci-storybook-main.yml does. Without this
            # step the image build fails on `COPY storybook-static`.
            - name: Build Storybook static output
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              run: npm run build-storybook

            - name: Add the Element Call view pages
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              continue-on-error: true
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: call-harness
                  path: storybook-static/call-harness

            # Both archives must pass before either versioned image is uploaded.
            - name: Build and scan the versioned frontend image
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              id: frontend_archive
              uses: ./.github/actions/docker-build-push
              with:
                  push_to_ghcr: false
                  image_name: ${{ env.IMAGE_NAME }}
                  release_labels: |
                      org.opencontainers.image.title=${{ env.IMAGE_NAME }}
                      org.opencontainers.image.version=${{ env.VERSION }}
                      org.opencontainers.image.revision=${{ github.sha }}

            - name: Build and scan the versioned Storybook image
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              id: storybook_archive
              uses: ./.github/actions/docker-build-push
              with:
                  push_to_ghcr: false
                  image_name: ${{ env.STORYBOOK_IMAGE_NAME }}
                  dockerfile: Dockerfile.storybook
                  release_labels: |
                      org.opencontainers.image.title=${{ env.STORYBOOK_IMAGE_NAME }}
                      org.opencontainers.image.version=${{ env.VERSION }}
                      org.opencontainers.image.revision=${{ github.sha }}

            - name: Login to GitHub Container Registry
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Verify tag still absent before publishing
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              run: python3 .github/scripts/release-publisher/guard.py assert-absent "$VERSION"

            - name: Publish the scanned frontend Docker image
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              id: frontend_image
              shell: bash
              env:
                  IMAGE_ARCHIVE: ${{ steps.frontend_archive.outputs.archive }}
                  IMAGE_TAGS: ${{ env.IMAGE }}
                  EXPECTED_DIGEST: ${{ steps.frontend_archive.outputs.archive_digest }}
                  EXPECTED_ARCHIVE_SHA256: ${{ steps.frontend_archive.outputs.archive_sha256 }}
              run: bash scripts/ci/publish-image-archive.sh "$IMAGE_ARCHIVE" "$EXPECTED_DIGEST" "$EXPECTED_ARCHIVE_SHA256"

            - name: Publish the scanned Storybook Docker image
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              id: storybook_image
              shell: bash
              env:
                  IMAGE_ARCHIVE: ${{ steps.storybook_archive.outputs.archive }}
                  IMAGE_TAGS: ${{ env.STORYBOOK_IMAGE }}
                  EXPECTED_DIGEST: ${{ steps.storybook_archive.outputs.archive_digest }}
                  EXPECTED_ARCHIVE_SHA256: ${{ steps.storybook_archive.outputs.archive_sha256 }}
              run: bash scripts/ci/publish-image-archive.sh "$IMAGE_ARCHIVE" "$EXPECTED_DIGEST" "$EXPECTED_ARCHIVE_SHA256"

            - name: Sign and publish frontend image provenance
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
              with:
                  subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
                  subject-digest: ${{ steps.frontend_image.outputs.digest }}
                  push-to-registry: true

            - name: Sign and publish Storybook image provenance
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.1.0
              with:
                  subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.STORYBOOK_IMAGE_NAME }}
                  subject-digest: ${{ steps.storybook_image.outputs.digest }}
                  push-to-registry: true

            - name: Verify tag still absent before tagging
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              run: python3 .github/scripts/release-publisher/guard.py assert-absent "$VERSION"

            - name: Create and push release tag
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              shell: bash
              run: |
                  set -euo pipefail

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "v${VERSION}" -m "Release frontend v${VERSION}"
                  git push origin "v${VERSION}"

            - name: Create GitHub Release
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ env.VERSION }}
                  name: Frontend v${{ env.VERSION }}
                  generate_release_notes: true
                  body: |
                      ## Release Artifact

                      Docker images:
                      `${{ env.IMAGE }}` (digest `${{ steps.frontend_image.outputs.digest }}`)
                      `${{ env.STORYBOOK_IMAGE }}` (digest `${{ steps.storybook_image.outputs.digest }}`)

                      Source branch:
                      `${{ github.ref_name }}`

                      Source commit:
                      `${{ github.sha }}`
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Release summary
              if: ${{ steps.disposition.outputs.mode == 'publish' }}
              shell: bash
              run: |
                  {
                    echo "### Frontend release image"
                    echo ""
                    echo "- Git tag: \`v${VERSION}\`"
                    echo "- Image: \`${IMAGE}\`"
                    echo "- Image digest: \`${REGISTRY}/${ORG}/${IMAGE_NAME}@${{ steps.frontend_image.outputs.digest }}\`"
                    echo "- Storybook image: \`${STORYBOOK_IMAGE}\`"
                    echo "- Storybook digest: \`${REGISTRY}/${ORG}/${STORYBOOK_IMAGE_NAME}@${{ steps.storybook_image.outputs.digest }}\`"
                    echo "- Source branch: \`${GITHUB_REF_NAME}\`"
                    echo "- GitHub Release: \`Frontend v${VERSION}\`"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Summarize verified existing release
              if: ${{ steps.disposition.outputs.mode == 'verify_existing' }}
              shell: bash
              run: |
                  {
                    echo "### Publishing skipped — existing immutable artifacts verified"
                    echo ""
                    echo "- Original source: \`${{ steps.disposition.outputs.source }}\`"
                    echo "- Permitted maintenance candidate: \`${GITHUB_SHA}\`"
                    echo "- Frontend digest: \`${{ steps.disposition.outputs.frontend_digest }}\`"
                    echo "- Storybook digest: \`${{ steps.disposition.outputs.storybook_digest }}\`"
                    echo "- No release image, remote tag, attestation or GitHub Release was written by this run."
                  } >> "$GITHUB_STEP_SUMMARY"
