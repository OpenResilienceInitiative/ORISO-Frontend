name: Build the Element Call view pages
description: >
    Builds the ORISO-ElementCall proof pages (`yarn build:harness`) and uploads
    them as the artifact `call-harness`. The publishing job downloads it into
    storybook-static/call-harness, where the "Call / Views" story embeds them
    (ORISO-Frontend#2233). Use this only in a job of its own with read-only
    permissions and no secrets: `yarn install` runs another repository's
    install scripts.

inputs:
    ref:
        description: ORISO-ElementCall branch or tag to build from
        required: false
        default: dev

runs:
    using: composite
    steps:
        - name: Check out ORISO-ElementCall
          uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
          with:
              repository: OpenResilienceInitiative/ORISO-ElementCall
              ref: ${{ inputs.ref }}
              path: _call-harness-src
              persist-credentials: false

        - name: Set up Node for Element Call
          uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
          with:
              node-version-file: _call-harness-src/.node-version

        - name: Build the call view pages
          shell: bash
          working-directory: _call-harness-src
          run: |
              corepack enable
              yarn install --immutable
              yarn build:harness

        - name: Hand the pages to the publishing job
          uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
          with:
              name: call-harness
              path: _call-harness-src/dist-harness
              if-no-files-found: error
              retention-days: 1
