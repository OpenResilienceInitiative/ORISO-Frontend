name: Reusable Docker build and publish steps

inputs:
  push_to_ghcr:
    description: Whether to push the built image to GHCR
    required: true
    type: boolean
  image_name:
    description: GHCR image name without registry or organization
    required: true
    type: string
  github_token:
    description: GitHub token used only when publishing is enabled
    required: true
    type: string
  dockerfile:
    description: Dockerfile path relative to the repository root
    required: false
    type: string
    default: Dockerfile
  platforms:
    description: Comma-separated OCI target platforms
    required: false
    type: string
    default: linux/amd64,linux/arm64

outputs:
  digest:
    description: Immutable multi-platform image digest
    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
  - name: Set up QEMU
    uses: docker/setup-qemu-action@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4

  - name: Login to GitHub Container Registry
    if: ${{ inputs.push_to_ghcr == 'true' }}
    uses: docker/login-action@v4
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ inputs.github_token }}

  - name: Extract Metadata
    id: meta
    uses: docker/metadata-action@v6
    with:
      images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}
      tags: |
        type=sha
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
        type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}

  - name: Build Docker image and publish when enabled
    id: build
    uses: docker/build-push-action@v7
    with:
      context: .
      file: ${{ inputs.dockerfile }}
      platforms: ${{ inputs.platforms }}
      push: ${{ inputs.push_to_ghcr }}
      provenance: mode=max
      sbom: true
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      # Scope the GHA cache per image so images built from this shared action
      # (here oriso-frontend and oriso-storybook) can't collide on one cache
      # namespace and restore each other's layers — root cause of
      # OpenResilienceInitiative/ORISO-Admin#424.
      cache-from: type=gha,scope=${{ inputs.image_name }}
      cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}
