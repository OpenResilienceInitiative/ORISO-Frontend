name: Reusable Docker build, scan and publish steps
description: Scan each platform before publishing the same OCI image.

inputs:
  push_to_ghcr:
    description: Whether to publish the scanned image to GHCR
    required: true
  image_name:
    description: GHCR image name without registry or organization
    required: true
  github_token:
    description: GitHub token used only when publishing is enabled
    required: false
    default: ''
  dockerfile:
    description: Dockerfile path relative to the repository root
    required: false
    default: Dockerfile
  platforms:
    description: Comma-separated OCI target platforms
    required: false
    default: linux/amd64,linux/arm64
  release_labels:
    description: Labels for a versioned release, which uses the existing release cache
    required: false
    default: ''

outputs:
  archive:
    description: Path to the scanned OCI archive in the current job
    value: ${{ steps.scan.outputs.archive }}
  archive_digest:
    description: Immutable index digest of the scanned image
    value: ${{ steps.build.outputs.digest }}
  archive_sha256:
    description: Scan receipt binding publication to the archive bytes
    value: ${{ steps.scan.outputs.archive_sha256 }}
  digest:
    description: Immutable digest of the scanned and published image
    value: ${{ steps.publish.outputs.digest }}

runs:
  using: composite
  steps:
  - name: Set up QEMU
    if: ${{ inputs.platforms != 'linux/amd64' }}
    uses: docker/setup-qemu-action@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v4

  - name: Extract Metadata
    id: meta
    if: ${{ inputs.release_labels == '' }}
    uses: docker/metadata-action@v6
    with:
      images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ inputs.image_name }}
      tags: |
        type=sha
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
        type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
        type=raw,value=pre-dev,enable=${{ github.ref == 'refs/heads/pre-dev' }}

  - name: Build the complete image without publishing
    id: build
    uses: docker/build-push-action@v7
    with:
      context: .
      file: ${{ inputs.dockerfile }}
      platforms: ${{ inputs.platforms }}
      push: false
      outputs: type=oci,dest=${{ runner.temp }}/${{ inputs.image_name }}.tar
      provenance: mode=max
      sbom: true
      labels: ${{ inputs.release_labels || steps.meta.outputs.labels }}
      # Branch and PR caches remain separate for the app and Storybook.
      cache-from: ${{ inputs.release_labels == '' && format('type=gha,scope={0}', inputs.image_name) || 'type=gha' }}
      cache-to: ${{ inputs.release_labels == '' && format('type=gha,mode=max,scope={0}', inputs.image_name) || 'type=gha,mode=max' }}

  - name: Install OCI transport
    shell: bash
    run: |
      if ! command -v skopeo >/dev/null; then
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends skopeo
      fi

  - name: Install Trivy
    uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
    with:
      version: v0.70.0
      cache: true

  - name: Reject fixable high or critical vulnerabilities on every platform
    id: scan
    shell: bash
    env:
      IMAGE_ARCHIVE: ${{ runner.temp }}/${{ inputs.image_name }}.tar
      IMAGE_PLATFORMS: ${{ inputs.platforms }}
      EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
    run: |
      bash scripts/ci/scan-image-archive.sh "$IMAGE_ARCHIVE" "$IMAGE_PLATFORMS" "$EXPECTED_DIGEST"
      printf 'archive=%s\n' "$IMAGE_ARCHIVE" >> "$GITHUB_OUTPUT"

  - name: Login to GitHub Container Registry
    if: ${{ inputs.push_to_ghcr == 'true' }}
    uses: docker/login-action@v4
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ inputs.github_token }}

  - name: Publish the scanned archive without rebuilding
    id: publish
    if: ${{ inputs.push_to_ghcr == 'true' }}
    shell: bash
    env:
      IMAGE_ARCHIVE: ${{ steps.scan.outputs.archive }}
      IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
      EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
      EXPECTED_ARCHIVE_SHA256: ${{ steps.scan.outputs.archive_sha256 }}
    run: bash scripts/ci/publish-image-archive.sh "$IMAGE_ARCHIVE" "$EXPECTED_DIGEST" "$EXPECTED_ARCHIVE_SHA256"
