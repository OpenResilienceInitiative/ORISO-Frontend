# Dependabot configuration.
#
# NOTE ON BRANCHES: `target-branch` only applies to VERSION updates. Dependabot
# SECURITY updates always open against the repository default branch (`main`)
# and cannot be retargeted from here. Since day-to-day work happens on
# `pre-dev`, security PRs against `main` fix nothing that is actually deployed.
# The real fix is to make `pre-dev` the default branch; until then security
# fixes have to be applied to `pre-dev` by hand.
#
# Security updates are split by dependency-type so that production findings
# (what actually ships to users) never drown in build/test tooling noise.
version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      target-branch: 'pre-dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 3
      versioning-strategy: increase
      commit-message:
          prefix: 'chore(deps)'
      groups:
          npm-security-production:
              applies-to: security-updates
              dependency-type: 'production'
              patterns: ['*']
          npm-security-development:
              applies-to: security-updates
              dependency-type: 'development'
              patterns: ['*']
          npm-minor-and-patch:
              applies-to: version-updates
              patterns: ['*']
              update-types: ['minor', 'patch']
      ignore:
          # Majors are upgraded deliberately, never by bot.
          - dependency-name: '*'
            update-types: ['version-update:semver-major']

    - package-ecosystem: 'npm'
      directory: '/proxy'
      target-branch: 'pre-dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 2
      versioning-strategy: increase
      commit-message:
          prefix: 'chore(deps)'
      groups:
          npm-security-production:
              applies-to: security-updates
              dependency-type: 'production'
              patterns: ['*']
          npm-security-development:
              applies-to: security-updates
              dependency-type: 'development'
              patterns: ['*']
          npm-minor-and-patch:
              applies-to: version-updates
              patterns: ['*']
              update-types: ['minor', 'patch']
      ignore:
          # Majors are upgraded deliberately, never by bot.
          - dependency-name: '*'
            update-types: ['version-update:semver-major']

    - package-ecosystem: 'github-actions'
      directory: '/'
      target-branch: 'pre-dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 1
      commit-message:
          prefix: 'chore(actions)'
      groups:
          github-actions:
              patterns: ['*']

    - package-ecosystem: 'docker'
      directory: '/'
      target-branch: 'pre-dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 1
      commit-message:
          prefix: 'chore(docker)'
      groups:
          docker-base-images:
              patterns: ['*']
