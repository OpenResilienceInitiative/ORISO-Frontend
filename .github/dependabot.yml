# Dependabot configuration.
#
# NOTE ON BRANCHES: `target-branch` only applies to VERSION updates. Dependabot
# SECURITY updates always open against the repository default branch (`main`)
# and cannot be retargeted from here. Human feature PRs and Dependabot version
# updates target `dev`. Security PRs against `main` are an exception; apply
# those fixes onto `dev` by hand when they matter for what is deployed.
#
# Security updates are grouped by dependency-type so one PR carries all
# production findings and one carries all build/test tooling findings.
version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      target-branch: 'dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 3
      commit-message:
          prefix: 'chore(deps)'
      groups:
          npm-security-production:
              applies-to: security-updates
              dependency-type: 'production'
              patterns: ['*']
          npm-security-development:
              applies-to: security-updates
              dependency-type: 'development'
              patterns: ['*']
          npm-minor-and-patch:
              applies-to: version-updates
              patterns: ['*']
              update-types: ['minor', 'patch']
      ignore:
          # Majors are upgraded deliberately, never by bot.
          - dependency-name: '*'
            update-types: ['version-update:semver-major']

    - package-ecosystem: 'github-actions'
      directory: '/'
      target-branch: 'dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 1
      commit-message:
          prefix: 'chore(actions)'
      groups:
          github-actions:
              patterns: ['*']

    - package-ecosystem: 'docker'
      directory: '/'
      target-branch: 'dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 1
      commit-message:
          prefix: 'chore(docker)'
      groups:
          docker-base-images:
              patterns: ['*']
